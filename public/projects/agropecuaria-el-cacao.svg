<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-label="Illustration: a cacao field with drip irrigation and pods">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e5effd"/>
      <stop offset="1" stop-color="#f4f8ff"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#sky)"/>
  <circle cx="680" cy="80" r="32" fill="#f79009" opacity="0.85"/>
  <!-- soil rows -->
  <path d="M0 268 H800 V400 H0 Z" fill="#087443"/>
  <path d="M0 300 H800 V400 H0 Z" fill="#095c37"/>
  <!-- drip lines -->
  <g stroke="#a9c5ec" stroke-width="5" stroke-linecap="round">
    <line x1="40" y1="292" x2="760" y2="292"/>
    <line x1="40" y1="332" x2="760" y2="332"/>
  </g>
  <g fill="#d4e3f8">
    <circle cx="140" cy="302" r="4"/><circle cx="260" cy="302" r="4"/><circle cx="380" cy="302" r="4"/>
    <circle cx="500" cy="302" r="4"/><circle cx="620" cy="302" r="4"/>
    <circle cx="200" cy="342" r="4"/><circle cx="320" cy="342" r="4"/><circle cx="440" cy="342" r="4"/>
    <circle cx="560" cy="342" r="4"/><circle cx="680" cy="342" r="4"/>
  </g>
  <!-- cacao tree -->
  <rect x="212" y="180" width="18" height="92" rx="8" fill="#101828"/>
  <circle cx="180" cy="160" r="44" fill="#099250"/>
  <circle cx="252" cy="152" r="48" fill="#099250"/>
  <circle cx="216" cy="120" r="36" fill="#16b364"/>
  <!-- pods -->
  <ellipse cx="182" cy="206" rx="13" ry="26" fill="#f79009" transform="rotate(-18 182 206)"/>
  <ellipse cx="254" cy="198" rx="13" ry="26" fill="#f79009" transform="rotate(16 254 198)"/>
  <path d="M176 190 q6 16 12 32" stroke="#101828" stroke-width="2.5" fill="none" opacity="0.4"/>
  <path d="M248 182 q6 16 12 32" stroke="#101828" stroke-width="2.5" fill="none" opacity="0.4"/>
  <!-- young plants -->
  <g>
    <rect x="470" y="238" width="8" height="32" rx="4" fill="#101828"/>
    <circle cx="460" cy="232" r="14" fill="#16b364"/>
    <circle cx="488" cy="228" r="16" fill="#16b364"/>
  </g>
  <g>
    <rect x="620" y="244" width="8" height="26" rx="4" fill="#101828"/>
    <circle cx="611" cy="240" r="12" fill="#16b364"/>
    <circle cx="636" cy="236" r="13" fill="#16b364"/>
  </g>
  <!-- water tank -->
  <rect x="60" y="196" width="70" height="72" rx="14" fill="#0042a1"/>
  <rect x="60" y="196" width="70" height="20" rx="10" fill="#0e4491"/>
  <rect x="88" y="176" width="14" height="24" rx="6" fill="#101828"/>
</svg>
